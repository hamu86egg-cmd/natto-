<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>納豆を混ぜるだけ</title>
<style>
html,body{margin:0;height:100%;background:#e9e2d6;overflow:hidden;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#2b2520;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,32,24,.55);z-index:5}
.box{width:min(440px,92vw);max-height:94vh;overflow:auto;background:#fbf7f0;border-radius:20px;padding:20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
h1{margin:0;font-size:24px}
.lead{color:#7a6d60;font-size:13px;margin:6px 0 14px}
.item{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;border-radius:14px;background:#fff;margin-bottom:10px;cursor:pointer;border:2px solid #eee3d3}
.item:hover{border-color:#d9a441}
.item .e{font-size:38px;width:52px;text-align:center}
.item .n{font-weight:900;font-size:17px}
.item .d{font-size:12px;color:#7a6d60;margin-top:2px}
.item .b{font-size:11px;color:#b07d1a;font-weight:700;margin-top:3px}
button{font:800 15px system-ui,sans-serif;color:#fff;background:#2b2520;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;margin:4px}
button.l{background:#efe6d8;color:#2b2520}
#act{position:fixed;left:50%;bottom:13.5%;transform:translateX(-50%);display:none;background:#5a2d0f;color:#fff;font-size:16px;padding:12px 24px;z-index:3;box-shadow:0 4px 0 #2b1405}
#done{position:fixed;left:50%;bottom:4%;transform:translateX(-50%);display:none;background:#d9a441;color:#2b2520;font-size:17px;padding:14px 28px;z-index:3;box-shadow:0 4px 0 #9b7120}
.grade{display:inline-block;font-size:44px;font-weight:900;width:84px;height:84px;line-height:84px;border-radius:50%;background:#2b2520;color:#fff;margin:6px 0}
.grade.legend{background:linear-gradient(135deg,#f7d774,#d9a441,#fff1b8,#c98a1a);color:#2b2520;font-size:22px}
.score{font-size:40px;font-weight:900;margin:4px 0}
.cmt{color:#7a6d60;margin-bottom:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="act">タレを入れる</button>
<button id="done">これで完成！</button>
<div class="ov" id="menu"><div class="box">
  <h1>〜するだけ</h1>
  <div class="lead">日常のひと手間を、極める。</div>
  <div id="list"></div>
</div></div>
<div class="ov" id="res"><div class="box">
  <div id="rName" style="font-weight:800;color:#7a6d60"></div>
  <div class="grade" id="rGrade"></div>
  <div class="score" id="rScore"></div>
  <div class="cmt" id="rCmt" style="white-space:pre-line"></div>
  <button id="again">もう1回</button><button id="copy" class="l">📋 結果をコピー</button><button id="back" class="l" style="display:none">一覧へ</button>
  <div id="copied" style="font-size:12px;color:#7a6d60;margin-top:6px"></div>
</div></div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,k)=>a+(b-a)*k;
const VW=420,VH=740;let Z=1,OX=0,OY=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);Z=Math.min(innerWidth/VW,innerHeight/VH);OX=(innerWidth/Z-VW)/2;OY=(innerHeight/Z-VH)/2;cv.width=innerWidth*DPR|0;cv.height=innerHeight*DPR|0;}
addEventListener('resize',resize);resize();

// ===== 音 =====
let AC=null;const lastS={};
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function tone(f1,f2,dur,type,vol,key,gap){if(!AC)return;const n=performance.now();if(key){if(n-(lastS[key]||0)<(gap||40))return;lastS[key]=n;}
  try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}}
function noise(dur,vol,freq,key,gap){if(!AC)return;const n=performance.now();if(key){if(n-(lastS[key]||0)<(gap||40))return;lastS[key]=n;}
  try{const len=AC.sampleRate*dur|0,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||2000;const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();}catch(e){}}

// ===== 入力 =====
const P={down:false,x:0,y:0,px:0,py:0,vx:0,vy:0,downT:0};
function toL(e){return [e.clientX/Z-OX,e.clientY/Z-OY];}
cv.addEventListener('pointerdown',e=>{initAudio();e.preventDefault();[P.x,P.y]=toL(e);P.px=P.x;P.py=P.y;P.down=true;P.downT=0;if(G&&state==='play'&&G.down)G.down(P.x,P.y);});
addEventListener('pointermove',e=>{[P.x,P.y]=toL(e);});
addEventListener('pointerup',()=>{if(P.down&&G&&state==='play'&&G.up)G.up();P.down=false;});

// ---- フィルム粒子（AIっぽい“つるつる感”を消す） ----
const GRAIN=(()=>{const c=document.createElement('canvas');c.width=c.height=160;const o=c.getContext('2d');const im=o.createImageData(160,160);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}o.putImageData(im,0,0);return c;})();
function drawGrain(a){ctx.save();ctx.globalAlpha=a;ctx.globalCompositeOperation='overlay';const ox=Math.random()*160|0,oy=Math.random()*160|0;for(let x=-OX-ox;x<VW+OX;x+=160)for(let y=-OY-oy;y<VH+OY;y+=160)ctx.drawImage(GRAIN,x,y);ctx.restore();}
function vignette(a){const g=ctx.createRadialGradient(VW*.42,VH*.4,VH*.25,VW/2,VH/2,VH*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(20,12,5,${a})`);ctx.fillStyle=g;ctx.fillRect(-OX,-OY,VW+OX*2,VH+OY*2);}
function srand(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}

// ===== 共通描画 =====
function table(c1,c2){const g=ctx.createLinearGradient(0,-OY,0,VH+OY);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(-OX,-OY,VW+OX*2,VH+OY*2);}
function label(t,y,size,col){ctx.textAlign='center';ctx.font=`800 ${size||16}px system-ui`;ctx.fillStyle=col||'#2b2520';ctx.fillText(t,VW/2,y);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// =========================================================
// 1. 納豆を混ぜるだけ（v0.9：市販パック／お箸→フィルム→混ぜる）
// =========================================================
const NATTO={
  name:'納豆を混ぜるだけ',emoji:'🫘',desc:'お箸を持って、フィルムをはがして、ひたすら混ぜる。回数もタレも自分の感覚で。目指せ糸1メートル。',
  PX:6,
  init(){
    this.Wl={x0:84,y0:300,x1:336,y1:556,r:24};this.c={x:210,y:428};
    const W=this.Wl;this.beans=[];this.D=19.5;const D=this.D;
    for(let row=0,y=W.y0+9;y<W.y1-7;row++,y+=D*.866)for(let x=W.x0+9+(row%2)*D/2;x<W.x1-7;x+=D)
      this.beans.push({x:x+rnd(-2,2),y:y+rnd(-2,2),vx:0,vy:0,a:rnd(0,TAU),s:rnd(.9,1.12),out:0,m:0,sp:Math.random()*12|0});
    if(!this.spr)this.makeSprites();
    if(!this.under)this.under=this.makeUnder();if(!this.web)this.web=this.makeWeb();
    this.phase='hashi';this.peel=0;this.pgrab=false;this.filmFly=0;this.hold=0;
    this.tip={x:300,y:520};this.cnt=0;this.neba=0;this.w=0;this.spill=0;this.tare=null;this.tareFx=0;this.lazy=0;this.msg=null;
    this.ff=[];this.trail=[];this.lo=[];this.recoil=[];this.lastP={x:210,y:428};
    this.len=0;this.strain=0;this.snap=0;this.grab=false;this.ended=false;this.camY=0;this.tipX=210;this.lspd=0;this.lmile={};
    this.tareBox={x:318,y:604,w:70,h:46};
  },
  st(){return clamp(this.neba/40,0,1);},
  makeSprites(){
    this.spr=[];const R=srand(19);
    for(let k=0;k<12;k++){const c=document.createElement('canvas');c.width=88;c.height=72;const o=c.getContext('2d');o.translate(44,36);o.scale(4,4);
      const h=24+R()*10,l=30+R()*10,rx=7.6+R()*1.2,ry=5.6+R()*.8;
      const g=o.createRadialGradient(-2,-2,1,0,0,rx);g.addColorStop(0,`hsl(${h},48%,${l+14}%)`);g.addColorStop(1,`hsl(${h-4},55%,${l-12}%)`);o.fillStyle=g;o.beginPath();o.ellipse(0,0,rx,ry,0,0,TAU);o.fill();
      o.fillStyle='rgba(255,255,255,.4)';o.beginPath();o.ellipse(-2,-2,2.5,1.3,0,0,TAU);o.fill();this.spr.push(c);}
    const h=document.createElement('canvas');h.width=h.height=48;const o=h.getContext('2d');const g=o.createRadialGradient(24,24,2,24,24,24);g.addColorStop(0,'rgba(255,253,244,1)');g.addColorStop(.5,'rgba(255,253,244,.55)');g.addColorStop(1,'rgba(255,253,244,0)');o.fillStyle=g;o.fillRect(0,0,48,48);this.halo=h;
  },
  makeUnder(){
    const W=this.Wl,oc=document.createElement('canvas');oc.width=VW*2;oc.height=VH*2;const o=oc.getContext('2d');o.scale(2,2);const R=srand(31);
    o.save();o.beginPath();o.roundRect?o.roundRect(W.x0,W.y0,W.x1-W.x0,W.y1-W.y0,W.r):o.rect(W.x0,W.y0,W.x1-W.x0,W.y1-W.y0);o.clip();
    o.fillStyle='#7a4a20';o.fillRect(W.x0,W.y0,W.x1-W.x0,W.y1-W.y0);
    for(let i=0;i<380;i++){o.save();o.translate(rnd(W.x0,W.x1),rnd(W.y0,W.y1));o.rotate(R()*TAU);const h=24+R()*10,l=32+R()*10;o.fillStyle=`hsl(${h},50%,${l}%)`;o.beginPath();o.ellipse(0,0,11,8,0,0,TAU);o.fill();o.fillStyle='rgba(255,255,255,.18)';o.beginPath();o.ellipse(-3,-3,3.2,1.6,0,0,TAU);o.fill();o.restore();}
    o.restore();return oc;
  },
  makeWeb(){
    const W=this.Wl,oc=document.createElement('canvas');oc.width=VW*2;oc.height=VH*2;const o=oc.getContext('2d');o.scale(2,2);const R=srand(55);
    o.lineCap='round';
    for(let i=0;i<420;i++){const x=rnd(W.x0,W.x1),y=rnd(W.y0,W.y1),a=R()*TAU,l=8+R()*26;o.strokeStyle=`rgba(255,253,244,${.25+R()*.45})`;o.lineWidth=.5+R()*1.3;o.beginPath();o.moveTo(x,y);o.quadraticCurveTo(x+Math.cos(a)*l*.5+rnd(-4,4),y+Math.sin(a)*l*.5+rnd(-4,4),x+Math.cos(a)*l,y+Math.sin(a)*l);o.stroke();}
    for(let i=0;i<260;i++){o.fillStyle=`rgba(255,255,250,${.3+R()*.4})`;o.beginPath();o.arc(rnd(W.x0,W.x1),rnd(W.y0,W.y1),.8+R()*2.2,0,TAU);o.fill();}
    return oc;
  },
  addTare(){if(this.tare!==null||this.phase!=='stir')return;this.tare=Math.round(this.cnt);this.tareFx=1;this.neba*=.65;for(const b of this.beans)b.m*=.65;noise(.4,.12,900);tone(300,200,.3,'sine',.05);},
  toLift(){if(this.phase!=='stir'||this.cnt<10)return;this.phase='lift';hideDone();this.ff=[];this.lo=[];this.tipX=this.tip.x;tone(600,900,.15,'triangle',.08);},
  bonus(){if(this.tare===null)return .9;return 1+.15*(1-Math.min(1,Math.abs(this.tare-305)/100));},
  maxLen(){return (6+this.neba*2.2)*this.bonus()*(1-this.spill/215*.6);},
  inWell(x,y){const W=this.Wl;return x>W.x0&&x<W.x1&&y>W.y0&&y<W.y1;},
  diag(){const W=this.Wl;return Math.hypot(W.x1-W.x0,W.y1-W.y0);},
  peelProj(x,y){const W=this.Wl,dx=W.x1-W.x0,dy=W.y1-W.y0,L=Math.hypot(dx,dy);return ((x-W.x0)*dx+(y-W.y0)*dy)/L;},
  down(x,y){
    if(this.phase==='hashi'){if(y>640&&y<720){this.hold=.001;tone(500,700,.08,'triangle',.05);}return;}
    if(this.phase==='film'){const pr=this.peelProj(x,y);if(Math.abs(pr-this.peel*this.diag())<60){this.pgrab=true;noise(.05,.05,5000);}return;}
    if(this.phase==='stir'){const t=this.tareBox;if(x>t.x&&x<t.x+t.w&&y>t.y&&y<t.y+t.h){this.addTare();this.tareTap=true;return;}this.tareTap=false;}
    if(this.phase==='lift'&&!this.ended){this.grab=true;}
  },
  up(){
    if(this.phase==='film')this.pgrab=false;
    if(this.phase==='lift'&&this.grab&&this.len>2&&!this.ended)this.finish(false);
  },
  update(dt){
    const c=this.c,st=this.st(),W=this.Wl;
    if(this.tareFx>0)this.tareFx-=dt;if(this.msg){this.msg.t-=dt;if(this.msg.t<=0)this.msg=null;}
    if(this.phase==='hashi'){if(this.hold>0){this.hold+=dt*2.5;if(this.hold>=1){this.phase='film';this.hold=1;}}}
    else if(this.phase==='film'){
      if(this.pgrab&&P.down){const np=clamp(this.peelProj(P.x,P.y)/this.diag(),this.peel,1);if(np>this.peel)noise(.04,.03,5500,'pl',60);this.peel=np;}
      if(this.peel>=.97&&!this.filmFly){this.filmFly=.001;this.pgrab=false;noise(.2,.08,4000);}
      if(this.filmFly>0){this.filmFly+=dt*1.8;if(this.filmFly>=1){this.phase='stir';doneBtn('持ち上げる',()=>this.toLift());}}
    }else if(this.phase==='stir'){
      const tip=this.tip,ox=tip.x,oy=tip.y;
      if(P.down&&!this.tareTap){const k=48/(1+this.neba*.01);tip.x+=(P.x-tip.x)*Math.min(1,dt*k);tip.y+=(P.y-tip.y)*Math.min(1,dt*k);}
      const sx=tip.x-ox,sy=tip.y-oy,seg=Math.hypot(sx,sy);let dc=0;
      this.w=lerp(this.w,seg/dt,Math.min(1,dt*8));
      if(P.down&&this.inWell(tip.x,tip.y))this.trail.push({x:tip.x,y:tip.y,l:.5,st});
      if(P.down&&seg>.3&&this.inWell(tip.x,tip.y)){
        dc=seg/100;const w=this.w;let good=0;if(w>450&&w<1900)good=1;else if(w>120&&w<=450)good=.4;else if(w>=1900)good=.55;
        let gain=dc*good*1.25;if(this.tare!==null)gain*=1.3;if(this.cnt>600)gain*=.4;
        const L2=seg*seg;
        for(const b of this.beans){
          if(b.out)continue;let k=((b.x-ox)*sx+(b.y-oy)*sy)/L2;k=clamp(k,0,1);
          const px=ox+sx*k,py=oy+sy*k,dx=b.x-px,dy=b.y-py,d2=dx*dx+dy*dy,sg=28+st*8,f=Math.exp(-d2/(2*sg*sg)),d=Math.sqrt(d2);
          if(f>.02){b.x+=sx*f;b.y+=sy*f;b.vx=lerp(b.vx,sx/dt*f*.35,.5);b.vy=lerp(b.vy,sy/dt*f*.35,.5);b.a+=(sx*dy-sy*dx)*f*.0006;b.m+=gain*f*.72;}
          if(d<40){
            if(d<18&&st>.03&&this.ff.length<90&&!b.ffOn&&Math.random()<.45){b.ffOn=1;this.ff.push({b,max:20+st*110+rnd(0,35),t:0});}}
        }
        
        tone(70+Math.min(w,2400)/30,55,.06,'sine',.03,'st',70);
        noise(.06,.02+st*.06,420-st*200,'nc',80);
      }else if(!P.down)this.w=lerp(this.w,0,Math.min(1,dt*4));
      this.cnt+=dc;
      const cap=.085*this.cnt+2;let sum=0,n=0;for(const b of this.beans){if(b.out)continue;sum+=Math.min(b.m,cap);n++;}this.neba=n?sum/n:0;
      if(P.down&&this.w<120&&this.cnt>0){this.lazy+=dt;if(this.lazy>2.5){this.lazy=0;this.msg={s:'手を抜くな',t:1.2};}}else this.lazy=0;
      if(!P.down&&this.ff.length){for(const f of this.ff)this.lo.push({b:f.b,x:this.lastP.x,y:this.lastP.y,max:f.max,t:0});this.ff=[];}
      if(P.down)this.lastP={x:tip.x,y:tip.y};
      for(const f of this.ff){f.t+=dt;const dx=tip.x-f.b.x,dy=tip.y-f.b.y,L=Math.hypot(dx,dy);f.l=L;const pull=Math.min(.06,st*.001*L);f.b.x+=dx*pull*dt*8;f.b.y+=dy*pull*dt*8;
        if(L>f.max){f.dead=true;f.b.ffOn=0;this.recoil.push({b:f.b,x:tip.x,y:tip.y,t:0});tone(1500,1200,.025,'sine',.014,'sn',60);}}
      this.ff=this.ff.filter(f=>!f.dead);
      for(const o of this.lo){o.t+=dt;o.y-=dt*260;const L=Math.hypot(o.x-o.b.x,o.y-o.b.y);o.l=L;if(L>o.max||o.t>1.2){o.dead=true;o.b.ffOn=0;this.recoil.push({b:o.b,x:o.x,y:o.y,t:0});tone(1300,1000,.03,'sine',.012,'sn',50);}}
      this.lo=this.lo.filter(o=>!o.dead);
      for(const r of this.recoil)r.t+=dt;this.recoil=this.recoil.filter(r=>r.t<.35);
      for(const t of this.trail)t.l-=dt*.35;this.trail=this.trail.filter(t=>t.l>0).slice(-120);
    }else{
      if(this.grab&&P.down&&!this.ended){
        const topZone=230;if(P.y<topZone)this.camY-=(topZone-P.y)*dt*2.2;
        this.tipX=lerp(this.tipX,P.x,Math.min(1,dt*10));
        const tipWorld=P.y+this.camY,nl=Math.max(0,(W.y0-20-tipWorld)/this.PX);
        const sp=(nl-this.len)/dt;this.lspd=lerp(this.lspd,Math.max(0,sp),Math.min(1,dt*6));
        if(sp>24)this.strain+=(sp-24)*dt*.22;
        if(nl>this.len)this.len=nl;
        for(const m of[23,50,100,150]){if(this.len>=m&&!this.lmile[m]){this.lmile[m]=1;tone(800,1100,.1,'triangle',.05);}}
        if(this.len+this.strain>=this.maxLen())this.finish(true);
      }
    }
    // 豆の物理：ぎっしり詰まった粘る塊（軽量版：配列グリッド・2回反復・少しだけ滑る）
    if(this.phase==='stir'){
      const bs=this.beans,D=this.D,CS=D,cols=Math.ceil((W.x1-W.x0)/CS)+3,rows=Math.ceil((W.y1-W.y0)/CS)+3,n=bs.length;
      const dmp=Math.pow(.004,dt);
      for(const b of bs){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=dmp;b.vy*=dmp;}
      if(!this.head||this.head.length!==cols*rows){this.head=new Int32Array(cols*rows);this.next=new Int32Array(n);}
      const head=this.head,next=this.next;
      for(let it=0;it<2;it++){
        head.fill(-1);
        for(let i=0;i<n;i++){const b=bs[i],c2=(Math.floor((b.y-W.y0)/CS)+1)*cols+Math.floor((b.x-W.x0)/CS)+1;next[i]=head[c2];head[c2]=i;}
        for(let i=0;i<n;i++){const a2=bs[i],cx=Math.floor((a2.x-W.x0)/CS)+1,cy=Math.floor((a2.y-W.y0)/CS)+1;

        for(let i=0;i<n;i++){const bx=c.x+(R()-.5)*170,by=c.y+(R()-.5)*170,sway=Math.sin(now*1.3+i)*(8+this.len*.25);const w=(.6+left*2.4*R())*(1-Math.min(.55,this.len/260)),beads=this.len>15?Math.min(4,1+(this.len/40|0)):0;this.strand(tipX+(R()-.5)*8,tipY+6,bx,by,w,.45+left*.5,sway,left>.15?beads:0);}}
      else{ctx.strokeStyle=`rgba(255,253,244,${this.snap})`;ctx.lineWidth=1;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(tipX,tipY+6);ctx.quadraticCurveTo(tipX+Math.sin(this.snap*20+i)*20,tipY+40,tipX+Math.sin(this.snap*14+i)*14,tipY+6+(1-this.snap)*140+i*8);ctx.stroke();}}
      const R2=srand(5);for(let i=0;i<5;i++){const x=tipX+(R2()-.5)*14,y=tipY+6+(R2()-.5)*10;ctx.save();ctx.translate(x,y);ctx.rotate(R2()*TAU);ctx.fillStyle='rgba(255,253,245,.6)';ctx.beginPath();ctx.ellipse(0,0,10,8,0,0,TAU);ctx.fill();ctx.fillStyle='#8a5a2a';ctx.beginPath();ctx.ellipse(0,0,11,8,0,0,TAU);ctx.fill();ctx.restore();}
      this.chopsticks(tipX,tipY);
    }
    ctx.restore();
    // UI
    ctx.textAlign='center';
    const say=(t,y,sz,col)=>{ctx.font=`800 ${sz}px system-ui`;ctx.lineWidth=5;ctx.strokeStyle='rgba(251,247,240,.9)';ctx.strokeText(t,VW/2,y);ctx.fillStyle=col||'#2b2520';ctx.fillText(t,VW/2,y);};
    if(this.phase==='hashi')say('まずはお箸を持つ（お箸をタップ）',70,18);
    else if(this.phase==='film'&&!this.filmFly)say('フィルムの角をつまんで、はがす',70,18);
    else if(this.phase==='stir'){if(this.cnt<3)say('お箸で混ぜる',70,20);if(this.tare===null&&this.cnt>20&&this.cnt<40)say('たれは好きなときに（袋をタップ）',100,13,'#7a6d60');if(this.msg)say(this.msg.s,130,22,'#8a2b1b');}
    else if(lift){
      ctx.fillStyle='rgba(251,247,240,.85)';rr(VW/2-110,18,220,74,16);ctx.fill();ctx.font='900 42px system-ui';ctx.fillStyle='#2b2520';ctx.fillText(`${this.len.toFixed(1)} cm`,VW/2,66);
      ctx.font='700 11px system-ui';ctx.fillStyle='#7a6d60';ctx.fillText(!this.grab?'お箸をつまんで上へ（上の方に指を置くと画面ごと上がる）':(this.lspd>24?'速すぎ！ 糸が細くなる':'その調子…ゆっくり'),VW/2,84);
      const left=1-clamp((this.len+this.strain)/this.maxLen(),0,1);if(this.grab&&!this.ended&&left<.25)say('糸が細くなってきた…！',124,18,'#c0392b');
    }
  }
};


// ===== 画面ボタン =====
let actFn=null,doneFn=null;
function actBtn(t,f){$('act').textContent=t;actFn=f;$('act').style.display='block';}
function doneBtn(t,f){$('done').textContent=t;doneFn=f;$('done').style.display='block';}
function showAct(){if(actFn&&state==='play')$('act').style.display='block';}
function hideAct(){$('act').style.display='none';}
function hideDone(){$('done').style.display='none';}
// ===== 進行 =====
const GAMES=[NATTO];
let G=null,gi=0,state='menu',shareTxt='';
const best={};try{Object.assign(best,JSON.parse(localStorage.getItem('dake_v1')||'{}'));}catch(e){}
const ORDER=['×','C','B','A','S','幻'];
function showResult(g,score,cmt,share){
  state='res';$('done').style.display='none';hideAct();
  const k='g'+gi;if(!best[k]||ORDER.indexOf(g)>ORDER.indexOf(best[k]))best[k]=g;try{localStorage.setItem('dake_v1',JSON.stringify(best));}catch(e){}
  $('rName').textContent=G.name;const el=$('rGrade');el.textContent=g==='幻'?'幻':g;el.className='grade'+(g==='幻'?' legend':'');
  $('rScore').textContent=score;$('rCmt').textContent=cmt;$('copied').textContent='';
  shareTxt=`『${G.name}』${G.emoji}\n${share}（${g==='幻'?'幻':'ランク'+g}）\n#〜するだけ`;
  if(g==='幻'){[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,f,.25,'triangle',.08),i*90));}
  $('res').style.display='flex';
}
function start(i){gi=i;G=GAMES[i];state='play';actFn=doneFn=null;$('menu').style.display='none';$('res').style.display='none';hideDone();hideAct();G.init();}
function menu(){
  state='menu';G=null;$('res').style.display='none';hideDone();hideAct();
  const l=$('list');l.innerHTML='';
  GAMES.forEach((g,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div class="e">${g.emoji}</div><div><div class="n">${g.name}</div><div class="d">${g.desc}</div>${best['g'+i]?`<div class="b">自己ベスト：${best['g'+i]==='幻'?'幻':'ランク'+best['g'+i]}</div>`:''}</div>`;d.addEventListener('click',()=>{initAudio();start(i);});l.appendChild(d);});
  $('menu').style.display='flex';
}
$('again').addEventListener('click',()=>{initAudio();start(gi);});
$('back').addEventListener('click',menu);
for(const id of['done','act'])$(id).addEventListener('pointerdown',e=>e.stopPropagation());
$('done').addEventListener('click',()=>{if(doneFn&&state==='play')doneFn();});
$('act').addEventListener('click',()=>{if(actFn&&state==='play')actFn();});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(shareTxt);$('copied').textContent='コピーしました';}catch(e){$('copied').textContent='コピーできませんでした';}});

let last=performance.now();
function frame(now){
  const dt=Math.min(1/30,Math.max(0,(now-last)/1000));last=now;
  if(G&&(state==='play'||state==='res'))G.update(dt);
  P.px=P.x;P.py=P.y;
  ctx.setTransform(DPR*Z,0,0,DPR*Z,DPR*Z*OX,DPR*Z*OY);
  if(G)G.draw();else table('#efe6d8','#d9cbb4');
  requestAnimationFrame(frame);
}
start(0);requestAnimationFrame(frame);
})();
</script>
